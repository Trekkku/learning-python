name: Sync Selected Files to GitVerse

on:
  schedule:
    # Проверка каждые 4 часа
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # 1. Клонируем ваш текущий репозиторий на GitHub со всей историей
      - name: Checkout local repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Скачиваем чистый текст (без HTML сайта)
      - name: Download files from foreign GitHub
        run: |
          echo "Скачиваем файл по прямой RAW-ссылке..."
          curl -s -L "https://github.com/igareck/vpn-configs-for-russia/blob/main/Vless-Reality-White-Lists-Rus-Mobile.txt" -o "igareck.txt"
          
          echo "Проверяем начало скачанного файла (для логов):"
          head -n 5 igareck.txt

      # 3. Фиксируем изменения и отправляем на GitVerse
      - name: Commit and Push changes
        env:
          GV_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          
          git checkout -B main
          
          if [ -n "$(git status --porcelain)" ]; then
            echo "Обнаружены изменения! Фиксируем..."
            git add .
            git commit -m "Авто-обновление прокси: $(date +'%Y-%m-%d %H:%M')"
            
            echo "Отправляем изменения в свой GitHub..."
            git push origin main --force
            
            echo "Настраиваем удаленный сервер GitVerse..."
            git remote set-url gitverse "https://token:${GV_TOKEN}@gitverse.ru/Trekkku/github_trekkku.git" 2>/dev/null || \
            git remote add gitverse "https://token:${GV_TOKEN}@gitverse.ru/Trekkku/github_trekkku.git"
            
            echo "Отправляем изменения на GitVerse..."
            git push gitverse main --force
            
            echo "Синхронизация успешно завершена!"
          else
            echo "Файлы полностью совпадают. Обновление не требуется."
          fi
