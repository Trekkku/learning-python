name: Sync Selected Files to GitVerse

on:
  push:
    branches:
      - main
  schedule:
    # Запуск каждые 15 минут для быстрой инициализации баз GitHub
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout local repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Скачиваем оригинал напрямую в шифратор Base64, минуя создание обычного txt файла
      - name: Download and Encode directly to Base64
        run: |
          echo "Скачиваем и кодируем прокси в Base64..."
          curl -s -L "https://raw.githack.com/igareck/vpn-configs-for-russia/main/Vless-Reality-White-Lists-Rus-Mobile.txt" | base64 -w 0 > igareck_base64.txt

      - name: Commit and Push changes
        env:
          GV_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          
          git checkout -B main
          
          if [ -n "$(git status --porcelain)" ]; then
            git add igareck_base64.txt
            git commit -m "Авто-обновление прокси Base64: $(date +'%Y-%m-%d %H:%M')"
            
            git push origin main --force
            
            git remote set-url gitverse "https://token:${GV_TOKEN}@gitverse.ru/Trekkku/github_trekkku.git" 2>/dev/null || \
            git remote add gitverse "https://token:${GV_TOKEN}@gitverse.ru/Trekkku/github_trekkku.git"
            
            git push gitverse main --force
            echo "Чистая Base64 подписка успешно синхронизирована!"
          else
            echo "Изменений в оригинале нет. Пропускаем."
          fi
